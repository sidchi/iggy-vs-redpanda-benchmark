services:
  iggy:
    image: apache/iggy:0.6.0
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE
    ulimits:
      memlock: -1
    environment:
      # Bind to all interfaces inside the container so the published port works
      IGGY_TCP_ADDRESS: "0.0.0.0:8090"
      # Server refuses a wildcard bind with no advertised address; give it localhost
      IGGY_NODE_ADVERTISED_ADDRESS: "127.0.0.1"
      # Create the well-known iggy/iggy root user (otherwise a random pw is generated)
      IGGY_ROOT_USERNAME: "iggy"
      IGGY_ROOT_PASSWORD: "iggy"
    ports:
      - "8090:8090"
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8090' 2>/dev/null || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=700M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
