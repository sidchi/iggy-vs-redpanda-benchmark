# Compile-only CI. Proves the harness builds for anyone who lands on the repo.
# It deliberately does NOT start the brokers or run the benchmark — those are
# run locally on hardware you describe (see README). CI here is a green
# "it compiles" signal, nothing more.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build (compile only)
        run: ./gradlew build -x test --no-daemon
